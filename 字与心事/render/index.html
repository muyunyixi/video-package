<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: "HW"; src: url("../assets/huiwen.otf"); font-display: block; }
      html, body { margin: 0; padding: 0; background: #000; overflow: hidden; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // a frozen copy of the bundle can be named (?b=bundle_x.js), so a long render is not
      // changed under it by a rebuild
      const b = new URLSearchParams(location.search).get("b") || "bundle.js";
      document.write('<script src="../out/' + b + '"><\/script>');
    </script>
  </body>
</html>
